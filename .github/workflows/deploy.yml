name: Deploy

# Only deploy when changes land on main (i.e. on merge).
on:
  workflow_dispatch: # todo: automatic deployment on merge to main is disabled since this is a proof-of-concept repository
  # push:
  #   branches: [main]

# Serialize deploys on main; never cancel an in-flight deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # for aws-actions/configure-aws-credentials (OIDC)
  contents: read

env:
  AWS_REGION: eu-north-1
  STAGE: prod

jobs:
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.detect.outputs.stacks }}
      groups: ${{ steps.detect.outputs.groups }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the previous commit

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: detect
        run: pnpm exec tsx scripts/changed-stacks.ts
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  deploy:
    name: Deploy changed stacks
    needs: detect
    if: needs.detect.outputs.count > 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build selected source and stack artifacts
        uses: ./.github/actions/build
        with:
          stacks: ${{ needs.detect.outputs.stacks }}
          stage: ${{ env.STAGE }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy group by group (producers before consumers). Stacks within a group
      # run in parallel; each is deployed with `--exclusively` so an unchanged
      # producer is never pulled in. If any stack in a group fails, the group
      # finishes but later (dependent) groups are skipped.
      - name: Deploy in dependency order
        env:
          GROUPS: ${{ needs.detect.outputs.groups }}
        run: |
          set -euo pipefail
          echo "$GROUPS" | jq -c '.[]' | while read -r group; do
            echo "::group::Deploying group: $group"
            echo "$group" | jq -r '.[]' | xargs -P 4 -I{} \
              pnpm exec cdk deploy {} \
                --exclusively \
                --require-approval never \
                --context stage="${STAGE}" \
                --context stacks={}
            echo "::endgroup::"
          done
